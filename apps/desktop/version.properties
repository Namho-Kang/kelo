# The desktop installers' package number, in one tracked place (docs/versioning.md). MSI and macOS need MAJOR >= 1 and an update
# needs a higher number than the installed one, so it keeps rising from the published 1.0.7 on its own, apart from the release
# version people see (version.json at the repository root, e.g. 0.9.0). Raise it for every desktop release; build.gradle.kts,
# .github/workflows/desktop-windows.yml and tools/build/desktop.sh all read it from here.
packageVersion=1.0.9
